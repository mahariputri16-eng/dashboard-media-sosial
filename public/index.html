<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Media Sosial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div class="min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-900 text-white p-6">
      <h1 class="text-2xl font-bold mb-8 text-indigo-400">SocialMetrics</h1>
      <nav class="space-y-4">
        <a href="#" class="block py-2.5 px-4 rounded bg-indigo-600 font-medium">Dashboard</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10">
      <header class="flex justify-between items-center mb-8">
        <div>
          <h2 class="text-3xl font-bold">Ringkasan Performa</h2>
          <p class="text-gray-500 text-sm">Laporan aktivitas semua platform media sosial</p>
        </div>
        <button onclick="loadAnalytics()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700 transition">
          Refresh Data
        </button>
      </header>

      <!-- KPI Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <p class="text-sm font-medium text-gray-500">Total Followers</p>
          <p id="total-followers" class="text-3xl font-bold mt-2">-</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <p class="text-sm font-medium text-gray-500">Total Engagement</p>
          <p id="total-engagement" class="text-3xl font-bold mt-2 text-emerald-600">-</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <p class="text-sm font-medium text-gray-500">Total Posting</p>
          <p id="total-posts" class="text-3xl font-bold mt-2">-</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <p class="text-sm font-medium text-gray-500">Rata-rata Jangkauan</p>
          <p id="avg-reach" class="text-3xl font-bold mt-2 text-indigo-600">-</p>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
        <h3 class="text-xl font-bold mb-4">Pertumbuhan Followers</h3>
        <div class="w-full h-80">
          <canvas id="growthChart"></canvas>
        </div>
      </div>

      <!-- Recent Posts Table -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-xl font-bold mb-4">Konten Terbaru</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-gray-200 text-gray-500 text-sm">
                <th class="pb-3">Platform</th>
                <th class="pb-3">Judul Konten</th>
                <th class="pb-3">Likes</th>
                <th class="pb-3">Komentar</th>
                <th class="pb-3">Tanggal</th>
              </tr>
            </thead>
            <tbody id="posts-table" class="divide-y divide-gray-100 text-sm"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    let chartInstance = null;

    // MASUKKAN URL BACKEND RENDER ANDA DI SINI NANTI (Tahap 4)
    const API_URL = 'http://localhost:3000/api/analytics';

    async function loadAnalytics() {
      try {
        const response = await fetch(API_URL);
        const res = await response.json();
        if (!res.success) return;

        const data = res.data;

        document.getElementById('total-followers').innerText = data.summary.totalFollowers.toLocaleString();
        document.getElementById('total-engagement').innerText = data.summary.totalEngagement.toLocaleString();
        document.getElementById('total-posts').innerText = data.summary.totalPosts.toLocaleString();
        document.getElementById('avg-reach').innerText = data.summary.avgReach.toLocaleString();

        const tableBody = document.getElementById('posts-table');
        tableBody.innerHTML = '';
        data.recentPosts.forEach(post => {
          tableBody.innerHTML += `
            <tr>
              <td class="py-3 font-semibold">${post.platform}</td>
              <td class="py-3">${post.title}</td>
              <td class="py-3">${post.likes.toLocaleString()}</td>
              <td class="py-3">${post.comments.toLocaleString()}</td>
              <td class="py-3 text-gray-500">${post.date}</td>
            </tr>`;
        });

        renderChart(data.chartData);
      } catch (err) {
        console.error('Gagal mengambil data:', err);
      }
    }

    function renderChart(chartData) {
      const ctx = document.getElementById('growthChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chartData.labels,
          datasets: [
            { label: 'Instagram', data: chartData.instagram, borderColor: '#E1306C', fill: false },
            { label: 'Twitter / X', data: chartData.twitter, borderColor: '#1DA1F2', fill: false },
            { label: 'YouTube', data: chartData.youtube, borderColor: '#FF0000', fill: false }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    loadAnalytics();
  </script>
</body>
</html>
